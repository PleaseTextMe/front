<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хуйня</title>
    <link rel="stylesheet" href="./depr.css">
</head>
<body>

    <div class="app-container">
        <!-- Боковая панель -->
        <div class="sidebar">
            <button onclick="handleAction('Клоун')">Клоун</button>
            <button onclick="handleAction('Осёл')">Осёл</button>
            <button onclick="handleAction('Жмот')">Жмот</button>
        </div>

        <!-- Основная область чата -->
        <div class="main-chat">
            <!-- Шапка -->
            <div class="chat-header">
                <div class="avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="user-info">
                    <h2>Пидор (Хопсо)</h2>
                    <span>Был в сети...</span>
                </div>
                <div class="menu-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>

            <!-- История сообщений -->
            <div class="chat-history">
                <div class="sparkle">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z"/>
                    </svg> <!-- Логотип гемини) -->
                </div>
            </div>

            <!-- Ввод сообщения -->
            <div class="chat-input-area">
                <div class="attach-btn" onclick="attachFile()">
                    <svg viewBox="0 0 24 24">
                        <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                    </svg>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="handleEnter(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипты для базовой работы интерфейса -->
    <script>
        function handleAction(type) {
            console.log(`Выбрано действие: ${type}`);
        }

        function attachFile() {
            console.log('Клик по иконке скрепки');
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('messageInput');
                if (input.value.trim() !== '') {
                    console.log(`Отправлено: ${input.value}`);
                    input.value = ''; // Очистка поля
                }
            }
        }
    </script>
</body>
</html>
